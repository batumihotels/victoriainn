<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#14202b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="#home" class="logo" id="logo" data-scroll></a>

      <nav class="nav-desktop" aria-label="Main">
        <ul class="nav-list">
          <li><a href="#" class="nav-link nav-link--book" data-i18n="navBook" data-booking target="_blank" rel="noopener noreferrer"></a></li>
          <li><a href="#contact" class="nav-link" data-i18n="navContact" data-scroll></a></li>
        </ul>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="GE">GE</button>
          <button type="button" class="lang-btn" data-lang="EN">EN</button>
          <button type="button" class="lang-btn" data-lang="RU">RU</button>
        </div>
      </nav>

      <button type="button" class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="drawer">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== MOBILE DRAWER ===== -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
    <div class="drawer__top">
      <span class="drawer__title" id="drawerTitle"></span>
      <button type="button" class="drawer__close" id="drawerClose" aria-label="Close">&times;</button>
    </div>
    <ul class="drawer__list">
      <li><a href="#" class="drawer__link drawer__link--book" data-i18n="navBook" data-booking target="_blank" rel="noopener noreferrer"></a></li>
      <li><a href="#contact" class="drawer__link" data-i18n="navContact" data-scroll></a></li>
    </ul>
    <div class="drawer__bottom">
      <div class="lang lang--drawer" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="GE">GE</button>
        <button type="button" class="lang-btn" data-lang="EN">EN</button>
        <button type="button" class="lang-btn" data-lang="RU">RU</button>
      </div>
    </div>
  </aside>

  <main>
    <!-- ===== HERO / GALLERY ===== -->
    <section class="hero" id="home" aria-roledescription="carousel">
      <div class="slider" id="slider">
        <div class="slider__track" id="sliderTrack"></div>
      </div>
      <div class="hero__shade"></div>

      <div class="hero__content container">
        <h1 class="hero__title" id="heroTitle"></h1>
        <p class="hero__subtitle" data-i18n="heroSubtitle"></p>
        <a href="#" class="btn btn--primary" data-i18n="bookNowBtn" data-booking target="_blank" rel="noopener noreferrer"></a>
      </div>

      <button type="button" class="slider__arrow slider__arrow--prev" id="prevBtn" aria-label="Previous">&#10094;</button>
      <button type="button" class="slider__arrow slider__arrow--next" id="nextBtn" aria-label="Next">&#10095;</button>
      <div class="slider__dots" id="sliderDots" role="tablist"></div>
    </section>

    <!-- ===== REVIEWS ===== -->
    <section class="section section--soft" id="reviews">
      <div class="container">
        <h2 class="section__title" data-i18n="reviewsTitle"></h2>
        <div class="reviews" id="reviewsList"></div>
      </div>
    </section>

    <!-- ===== CONTACT ===== -->
    <section class="section" id="contact">
      <div class="container">
        <h2 class="section__title" data-i18n="contactTitle"></h2>

        <div class="contact">
          <div class="contact__info">
            <div class="info-card">
              <span class="info-card__icon" data-icon="phone"></span>
              <div>
                <h3 data-i18n="phoneLabel"></h3>
                <p id="phones"></p>
              </div>
            </div>
            <div class="info-card">
              <span class="info-card__icon" data-icon="mail"></span>
              <div>
                <h3 data-i18n="emailLabel"></h3>
                <p><a id="emailLink" href="#"></a></p>
              </div>
            </div>
            <div class="info-card">
              <span class="info-card__icon" data-icon="pin"></span>
              <div>
                <h3 data-i18n="addressLabel"></h3>
                <p id="address"></p>
              </div>
            </div>

            <div class="social" id="social"></div>
          </div>

          <div class="contact__map">
            <iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span id="footerName"></span>
      <span><span id="year"></span> &copy; <span data-i18n="rights"></span></span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
